services:
  db:
    image: postgres:15
    container_name: duolingo-db
    environment:
      - POSTGRES_USER=qtitpc
      - POSTGRES_PASSWORD=21107
      - POSTGRES_DB=duolingo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: duolingo-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://qtitpc:21107@db:5432/duolingo
      - FRONTEND_INTERNAL_URL=http://frontend:3000
      - APP_URL=${APP_URL:-https://robogo.qtitpc.dev}
      - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-resend}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-Robogo <noreply@qtitpc.dev>}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: node:22-slim
    container_name: duolingo-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/.next
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:4000
      - DATABASE_URL=postgresql://qtitpc:21107@db:5432/duolingo
    env_file:
      - ./frontend/.env.local
    command: sh -c "npm run build && npm run start -- --hostname 0.0.0.0"
    depends_on:
      - backend
      - db
    restart: unless-stopped

volumes:
  pgdata:
