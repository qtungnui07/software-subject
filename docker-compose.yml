version: '3.8'
services:
  db:
    image: postgres:15
    container_name: duolingo-db
    environment:
      - POSTGRES_USER=qtitpc
      - POSTGRES_PASSWORD=21107
      - POSTGRES_DB=duolingo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: duolingo-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://qtitpc:21107@db:5432/duolingo
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: node:22-slim
    container_name: duolingo-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/.next
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend:4000
      - DATABASE_URL=postgresql://qtitpc:21107@db:5432/duolingo
    env_file:
      - ./frontend/.env.local
    command: npm run dev:turbo -- --hostname 0.0.0.0
    depends_on:
      - backend
      - db
    restart: unless-stopped

volumes:
  pgdata:
