name: Adaptive Learning CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/adaptive-learning-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/adaptive-learning-ci.yml"

permissions:
  contents: read

concurrency:
  group: adaptive-learning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SKIP_LIVE_DATABASE_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run adaptive learning tests
        run: npm run check:adaptive-learning

      - name: Lint adaptive learning files
        run: npm run lint:adaptive-learning

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
